<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>jeen-yuhs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background-color: #f2f2f2;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* =========================
           PLUS / MINUS BUTTON
        ========================= */

        #sizeButton {
            position: fixed;

            top: 22px;
            left: 22px;

            width: 24px;
            height: 24px;

            padding: 0;
            margin: 0;

            border: none;
            outline: none;
            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 1000;

            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .symbol {
            position: relative;

            width: 16px;
            height: 16px;

            transition:
                transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .symbol::before,
        .symbol::after {
            content: "";

            position: absolute;

            top: 50%;
            left: 50%;

            width: 15px;
            height: 1.9px;

            background-color: #000000;

            transform: translate(-50%, -50%);

            transition:
                transform 0.6s cubic-bezier(0.65, 0, 0.35, 1),
                opacity 0.35s ease;
        }

        /* Vertical line */

        .symbol::after {
            transform:
                translate(-50%, -50%)
                rotate(90deg);
        }

        /* =========================
           PLUS → MINUS ANIMATION
        ========================= */

        #sizeButton.active .symbol {
            transform: rotate(180deg);
        }

        #sizeButton.active .symbol::after {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                rotate(90deg)
                scaleY(0);
        }


        /* =========================
           PERFECT CENTER
        ========================= */

        #center {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =========================
           TEXT
        ========================= */

        #mainText {
            margin: 0;
            padding: 0;

            white-space: nowrap;

            text-align: center;

            font-size: 22px;
            font-weight: 700;

            line-height: 1;
        }


        /* =========================
           EXPANDED TEXT
           NO ANIMATION
        ========================= */

        #mainText.expanded {
            font-size: clamp(18px, 3vw, 32px);
            font-weight: 400;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #sizeButton {
                top: 18px;
                left: 18px;
            }

            #mainText {
                font-size: 20px;
            }

            #mainText.expanded {
                font-size: clamp(16px, 5vw, 28px);
            }
        }


        /* =========================
           TABLET
        ========================= */

        @media (min-width: 601px) and (max-width: 1024px) {

            #mainText {
                font-size: 22px;
            }

            #mainText.expanded {
                font-size: clamp(20px, 4vw, 30px);
            }
        }


        /* =========================
           LAPTOP / DESKTOP
        ========================= */

        @media (min-width: 1025px) {

            #mainText {
                font-size: 22px;
            }

            #mainText.expanded {
                font-size: clamp(24px, 3vw, 32px);
            }
        }
    </style>
</head>

<body>

    <button
        id="sizeButton"
        aria-label="Expand text"
        type="button"
    >
        <span class="symbol"></span>
    </button>


    <main id="center">
        <p id="mainText">jeen-yuhs</p>
    </main>


    <script>
        const button = document.getElementById("sizeButton");
        const text = document.getElementById("mainText");

        let expanded = false;

        button.addEventListener("click", () => {

            expanded = !expanded;

            if (expanded) {

                text.textContent =
                    "will it ever be available to the public";

                text.classList.add("expanded");
                button.classList.add("active");

                button.setAttribute(
                    "aria-label",
                    "Collapse text"
                );

            } else {

                text.textContent = "jeen-yuhs";

                text.classList.remove("expanded");
                button.classList.remove("active");

                button.setAttribute(
                    "aria-label",
                    "Expand text"
                );
            }
        });
    </script>

</body>
</html>
