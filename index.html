<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f2f2f2;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Plus / Minus button */
        #sizeButton {
            position: fixed;
            top: 22px;
            left: 22px;

            width: 24px;
            height: 24px;

            padding: 0;
            border: none;
            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 1000;
        }

        /* Symbol */
        .symbol {
            position: relative;
            width: 16px;
            height: 16px;

            transition:
                transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .symbol::before,
        .symbol::after {
            content: "";

            position: absolute;
            top: 50%;
            left: 50%;

            width: 15px;
            height: 1.9px;

            background-color: #000000;

            transform: translate(-50%, -50%);

            transition:
                transform 0.6s cubic-bezier(0.65, 0, 0.35, 1),
                opacity 0.35s ease;
        }

        .symbol::after {
            transform:
                translate(-50%, -50%)
                rotate(90deg);
        }

        /* Plus → Minus */
        #sizeButton.active .symbol {
            transform: rotate(180deg);
        }

        #sizeButton.active .symbol::after {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                rotate(90deg)
                scaleY(0);
        }

        /* Text area */
        #textWrapper {
            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            height: 40px;

            width: 40px;

            overflow: hidden;

            transition:
                width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* Text */
        #mainText {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            white-space: nowrap;

            font-size: 22px;
            font-weight: 700;
            line-height: 1;

            color: #000000;
        }

        /* Expanded */
        #textWrapper.expanded {
            width: 620px;
        }

        #mainText.expanded {
            font-size: 32px;
            font-weight: 400;
        }
    </style>
</head>

<body>

    <button id="sizeButton" aria-label="Expand text">
        <span class="symbol"></span>
    </button>

    <div id="textWrapper">
        <div id="mainText">one</div>
    </div>

    <script>
        const button = document.getElementById("sizeButton");
        const wrapper = document.getElementById("textWrapper");
        const text = document.getElementById("mainText");

        let expanded = false;

        button.addEventListener("click", () => {

            expanded = !expanded;

            if (expanded) {

                text.textContent =
                    "will it ever be available to the public";

                text.classList.add("expanded");
                wrapper.classList.add("expanded");

                button.classList.add("active");

            } else {

                text.textContent = "one";

                text.classList.remove("expanded");
                wrapper.classList.remove("expanded");

                button.classList.remove("active");
            }
        });
    </script>

</body>
</html>
