<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            background-color: #f2f2f2;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* =========================
           PLUS / MINUS BUTTON
        ========================= */

        #sizeButton {
            position: fixed;

            top: 22px;
            left: 22px;

            width: 24px;
            height: 24px;

            padding: 0;
            border: none;
            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 1000;

            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .symbol {
            position: relative;

            width: 16px;
            height: 16px;

            transition:
                transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .symbol::before,
        .symbol::after {
            content: "";

            position: absolute;

            top: 50%;
            left: 50%;

            width: 15px;
            height: 1.9px;

            background-color: #000000;

            transform: translate(-50%, -50%);

            transition:
                transform 0.6s cubic-bezier(0.65, 0, 0.35, 1),
                opacity 0.35s ease;
        }

        .symbol::after {
            transform:
                translate(-50%, -50%)
                rotate(90deg);
        }

        /* Plus → Minus */
        #sizeButton.active .symbol {
            transform: rotate(180deg);
        }

        #sizeButton.active .symbol::after {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                rotate(90deg)
                scaleY(0);
        }


        /* =========================
           TEXT WRAPPER
        ========================= */

        #textWrapper {
            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 40px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            transition:
                width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }


        /* =========================
           TEXT
        ========================= */

        #mainText {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            margin: 0;

            white-space: nowrap;

            font-size: 22px;
            font-weight: 700;

            line-height: 1;

            color: #000000;

            /*
             * The text itself does NOT move.
             * It stays exactly at the center.
             */
        }


        /* =========================
           EXPANDED STATE
        ========================= */

        #textWrapper.expanded {
            width: min(620px, calc(100vw - 32px));
        }

        #mainText.expanded {
            font-size: 32px;
            font-weight: 400;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #sizeButton {
                top: 18px;
                left: 18px;
            }

            #textWrapper {
                width: 40px;
            }

            #textWrapper.expanded {
                /*
                 * Always leave equal space
                 * on both sides of the screen.
                 */
                width: calc(100vw - 20px);
            }

            #mainText {
                font-size: 20px;
            }

            #mainText.expanded {
                /*
                 * Smaller font on phones,
                 * but it remains centered.
                 */
                font-size: 5vw;
                font-weight: 400;
            }
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            #textWrapper.expanded {
                width: calc(100vw - 12px);
            }

            #mainText.expanded {
                font-size: 4.5vw;
            }
        }
    </style>
</head>

<body>

    <button id="sizeButton" aria-label="Expand text">
        <span class="symbol"></span>
    </button>

    <div id="textWrapper">
        <div id="mainText">one</div>
    </div>


    <script>
        const button = document.getElementById("sizeButton");
        const wrapper = document.getElementById("textWrapper");
        const text = document.getElementById("mainText");

        let expanded = false;

        button.addEventListener("click", () => {

            expanded = !expanded;

            if (expanded) {

                text.textContent =
                    "will it ever be available to the public";

                text.classList.add("expanded");
                wrapper.classList.add("expanded");

                button.classList.add("active");

                button.setAttribute(
                    "aria-label",
                    "Collapse text"
                );

            } else {

                text.textContent = "one";

                text.classList.remove("expanded");
                wrapper.classList.remove("expanded");

                button.classList.remove("active");

                button.setAttribute(
                    "aria-label",
                    "Expand text"
                );
            }
        });
    </script>

</body>
</html>
